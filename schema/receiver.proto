syntax = "proto3";

package orbit.transfer.v1;
option swift_prefix = "Wire_";

import "buf/validate/validate.proto";

// The API contract. Health original content remains opaque, immutable UTF-8 JSON.
// A batch is encoded ONCE as ProtoJSON, persisted, and carried unchanged in CommitRequest.
message Record {
  string record_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"}];
  string content = 2 [(buf.validate.field).string = {min_bytes: 1, max_bytes: 65536}];
}
message Batch {
  uint32 protocol_version = 1 [(buf.validate.field).uint32.const = 1];
  string server_id = 2 [(buf.validate.field).string.uuid = true];
  string installation_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"}];
  string batch_id = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"}];
  repeated Record records = 5 [(buf.validate.field).repeated = {min_items: 1, max_items: 2000}];
}
message ReceiptRecord {
  string record_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"}];
  string content_hash = 2 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
}
message Receipt {
  uint32 protocol_version = 1 [(buf.validate.field).uint32.const = 1];
  string server_id = 2 [(buf.validate.field).string.uuid = true];
  string installation_id = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"}];
  string batch_id = 4 [(buf.validate.field).string = {min_len: 1, max_len: 128, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"}];
  string request_hash = 5 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
  // Keep the receiver's original timestamp string, without Date re-encoding.
  string stored_at = 6 [(buf.validate.field).string = {min_len: 1, max_len: 64}];
  repeated ReceiptRecord records = 7 [(buf.validate.field).repeated = {min_items: 1, max_items: 2000}];
}
message ContractIdentity {
  uint32 revision = 1 [(buf.validate.field).uint32.gt = 0];
  string schema_hash = 2 [(buf.validate.field).string.pattern = "^[a-f0-9]{64}$"];
}
message DiscoverRequest {
  ContractIdentity client_contract = 1 [(buf.validate.field).required = true];
}
message Limits {
  uint32 body_bytes = 1 [(buf.validate.field).uint32.gt = 0];
  uint32 record_bytes = 2 [(buf.validate.field).uint32.gt = 0];
  uint32 records = 3 [(buf.validate.field).uint32.gt = 0];
}
message ServerInfo {
  string server_id = 1 [(buf.validate.field).string.uuid = true];
  ContractIdentity contract = 2 [(buf.validate.field).required = true];
  Limits limits = 3 [(buf.validate.field).required = true];
}
message CommitRequest {
  ContractIdentity client_contract = 1 [(buf.validate.field).required = true];
  // SHA256 and receipt bind these exact bytes, NOT a reserialized RPC envelope.
  bytes batch_json = 2 [(buf.validate.field).bytes = {min_len: 1, max_len: 4194304}];
}

enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  FAILURE_REASON_AUTHENTICATION_REQUIRED = 1;
  FAILURE_REASON_ACCESS_DENIED = 2;
  FAILURE_REASON_CLIENT_UPDATE_REQUIRED = 3;
  FAILURE_REASON_SERVER_UPDATE_REQUIRED = 4;
  FAILURE_REASON_CONTRACT_MISMATCH = 5;
  FAILURE_REASON_INVALID_ENVELOPE = 6;
  FAILURE_REASON_INVALID_UTF8 = 7;
  FAILURE_REASON_INVALID_JSON = 8;
  FAILURE_REASON_DUPLICATE_RECORD_ID = 9;
  FAILURE_REASON_RECORD_TOO_LARGE = 10;
  FAILURE_REASON_INVALID_RECORD = 11;
  FAILURE_REASON_INVALID_TIME_RANGE = 12;
  FAILURE_REASON_WRONG_SERVER = 13;
  FAILURE_REASON_IDENTITY_CONFLICT = 14;
  FAILURE_REASON_SERVER_BUSY = 15;
  FAILURE_REASON_REQUEST_TIMEOUT = 16;
  FAILURE_REASON_STORAGE_BUSY = 17;
  FAILURE_REASON_STORAGE_FULL = 18;
  FAILURE_REASON_STORAGE_ACCESS = 19;
  FAILURE_REASON_STORAGE_CORRUPT = 20;
  FAILURE_REASON_STORAGE_UNAVAILABLE = 21;
  FAILURE_REASON_INTERNAL = 22;
}
message FailureDetail {
  FailureReason reason = 1 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  string request_id = 2 [(buf.validate.field).string.uuid = true];
  // Indices and fixed reason codes only. Never values, identifiers, credentials or SQL.
  optional uint32 record_index = 3 [(buf.validate.field).uint32.lt = 2000];
  optional uint32 retry_after_seconds = 4 [(buf.validate.field).uint32 = {gte: 1, lte: 3600}];
}
service Receiver {
  rpc Discover(DiscoverRequest) returns (ServerInfo);
  rpc Commit(CommitRequest) returns (Receipt);
}
