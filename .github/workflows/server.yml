name: Server checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '12.14.0'
      - run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - name: Smoke test the receiver
        working-directory: server
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { randomBytes } from 'node:crypto';
          import { createApp } from './src/app.ts';
          import { createRpcHandler } from './src/rpc.ts';
          import { ReceiverStore } from './src/store.ts';

          const store = new ReceiverStore(':memory:');
          const token = randomBytes(32).toString('hex');
          try {
            createRpcHandler(store, token);
            const app = createApp(store, token);
            assert.equal((await app.request('/v1/server')).status, 401);
            const response = await app.request('/v1/server', {
              headers: { Authorization: `Bearer ${token}` },
            });
            assert.equal(response.status, 200);
            assert.equal((await response.json()).serverId, store.serverId);
          } finally {
            store.close();
          }
          JS
